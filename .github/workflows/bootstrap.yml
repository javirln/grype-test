name: Bootstrap a grype DB from sources

# One run with no caches: every provider syncs from its upstream source in its own job, then one job builds,
# packages and checks the DB. Nothing is published; the DB and the report are workflow artifacts.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  sync:
    name: sync ${{ matrix.provider }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        provider: [nvd, alpine, alma, arch, amazon, bitnami, chainguard, chainguard-libraries, debian, echo, eol, epss,
                   fedora, github, govulndb, hummingbird, kev, mariner, minimos, oracle, photon, rhel, secureos, sles,
                   ubuntu, wolfi]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the runner
        run: scripts/prepare-runner.sh
      - name: Install grype-db
        run: scripts/install-tools.sh grype-db
      - name: Sync from the upstream source
        env:
          PROVIDER: ${{ matrix.provider }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/sync-provider.sh "$PROVIDER"
      - name: Upload the cache and the timing
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-${{ matrix.provider }}
          path: out/${{ matrix.provider }}/
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn

  build:
    needs: sync
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the runner
        run: scripts/prepare-runner.sh
      - name: Install grype-db and grype
        run: scripts/install-tools.sh grype-db && scripts/install-tools.sh grype
      - name: Download the provider caches
        uses: actions/download-artifact@v4
        with:
          pattern: sync-*
          path: dl
      - name: Build and package the DB
        run: scripts/build-db.sh
      - name: Check the DB against Anchore's latest DB
        run: scripts/test-db.sh
      - name: Upload the DB and the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: grype-db
          path: |
            out/build/report.md
            out/build/*.tsv
            out/build/*.txt
            out/build/*.log
            out/build/*.err
            out/build/latest.json
            out/build/*.tar.zst
          compression-level: 0
          retention-days: 5
